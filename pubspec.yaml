# pubspec.yaml
name: ultra_sales_dashboard
description: Ultra Modern Sales Dashboard with Glassmorphism UI
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

  # Core UI & Navigation
  cupertino_icons: ^1.0.8

  # Data Formatting & Internationalization
  intl: ^0.19.0

  # Charts & Data Visualization
  fl_chart: ^0.68.0

  # Animations & Effects
  flutter_animate: ^4.5.0

  # State Management
  provider: ^6.1.2

  # HTTP & API
  dio: ^5.4.3+1
  http: ^1.2.1

  # Local Storage
  shared_preferences: ^2.2.3

  # Utils
  equatable: ^2.0.5
  pdf: ^3.11.1
  printing: ^5.12.0
  path_provider: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Linting & Code Quality
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # Assets
  assets:
    - assets/images/
    - assets/icons/

  # Custom Fonts for Modern Look
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700